name: Sync Google Calendar

# Va chercher l'agenda Google (adresse secrète iCal) côté serveur GitHub, où il n'y a aucun souci
# de CORS, et dépose le résultat dans le repo. L'app lit ensuite ce fichier directement (même
# origine que le site, donc toujours accessible) au lieu de dépendre de proxies CORS publics
# tiers — cassants et peu fiables sur la durée.
#
# Mise en place (une seule fois) : Réglages du repo → Secrets and variables → Actions →
# "New repository secret" → nom GCAL_ICS_URL → colle l'adresse secrète iCal de Google Agenda
# (Google Agenda → ⚙️ Paramètres → ton agenda → "Adresse secrète au format iCal") → Add secret.
# Garde bien la même URL des deux côtés (ce secret ET les réglages de synchro dans l'app).

on:
  schedule:
    - cron: "*/30 * * * *" # toutes les 30 minutes
  workflow_dispatch: # bouton "Run workflow" manuel dans l'onglet Actions, pour tester

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupère l'ICS
        env:
          ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: |
          if [ -z "$ICS_URL" ]; then
            echo "Secret GCAL_ICS_URL non configuré — rien à synchroniser, voir les instructions en haut de ce fichier."
            exit 0
          fi
          curl -sSL --fail --max-time 30 -o calendar-sync.ics.tmp "$ICS_URL"
          if ! grep -q "BEGIN:VEVENT" calendar-sync.ics.tmp; then
            echo "Réponse reçue mais sans événement (BEGIN:VEVENT absent) — URL probablement invalide, on abandonne sans écraser l'ancien fichier."
            rm -f calendar-sync.ics.tmp
            exit 1
          fi
          # Marqueur d'origine : l'app ne fait confiance à ce fichier que si cette ligne correspond
          # exactement à l'URL que l'utilisateur·rice a configurée dans ses propres réglages — ça
          # évite qu'une autre personne connectée sur ce même site reçoive PAR ERREUR l'agenda de
          # ce secret (ce fichier est unique et partagé par tout le monde qui visite le site).
          { printf 'X-SYNCED-SOURCE-URL:%s\n' "$ICS_URL"; cat calendar-sync.ics.tmp; } > calendar-sync.ics
          rm -f calendar-sync.ics.tmp

      - name: Commit si changé
        run: |
          if [ ! -f calendar-sync.ics ]; then
            echo "Pas de fichier à committer."
            exit 0
          fi
          if git diff --quiet -- calendar-sync.ics; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar-sync.ics
          git commit -m "Synchro auto Google Agenda"
          git push
